# gitleaks configuration — Patchset 151
# https://github.com/gitleaks/gitleaks

title = "Consultaion secret scanning config"

[extend]
# Use default gitleaks rules as baseline
useDefault = true

[allowlist]
  description = "Global allowlist — test fixtures, generated artifacts, docs"
  paths = [
    '''node_modules''',
    '''.next''',
    '''.venv''',
    '''venv''',
    '''__pycache__''',
    '''.git''',
    '''coverage''',
    '''out''',
    '''dist''',
    '''build''',
    '''\.mypy_cache''',
    '''\.ruff_cache''',
    '''\.pytest_cache''',
    '''apps/web/e2e/.*\.ts$''',  # E2E test helpers with mock tokens
    '''test-results''',
    '''\.playwright''',
    '''CHANGELOG\.md''',
    '''docs/audits/.*''',
  ]

# Custom rules for this project
[[rules]]
  id = "supabase-pooler-url"
  description = "Supabase pooler connection URL with password"
  regex = '''postgres(?:ql)?://[^:\s]+:[^@\s]+@[^:\s]+\.pooler\.supabase\.com'''
  tags = ["postgres", "supabase", "credential"]

[[rules]]
  id = "generic-postgres-url"
  description = "PostgreSQL connection URL with embedded password"
  regex = '''postgres(?:ql)?://[^:\s]+:[^@\s]+@[^\s]+'''
  tags = ["postgres", "credential"]
  [[rules.allowlists]]
    paths = ['''\.env\.example$''', '''\.example$''', '''tests/.*''', '''docs/.*''']

[[rules]]
  id = "hardcoded-password-assignment"
  description = "Hardcoded password in variable assignment"
  regex = '''(?i)(?:password|passwd|pwd|secret|api_?key|token)\s*[=:]\s*["'][^"']{8,}["']'''
  tags = ["password", "credential"]
  [[rules.allowlists]]
    paths = ['''tests/.*''', '''\.env\.example$''', '''tests/.*\.py$''']
    # Allow settings.py / config.py defaults
    regexes = ['''(?i)change_me|default|placeholder|example''']
