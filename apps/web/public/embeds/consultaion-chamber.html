<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consultaion — Chamber</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f2f2}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head><body>
<canvas id="chamber"></canvas>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.184.0/build/three.module.js';
import { OrbitControls } from 'https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js';

const canvas=document.getElementById('chamber');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xf3f2f2);
const camera=new THREE.PerspectiveCamera(38,1,0.01,10);
camera.position.set(0.34,0.27,0.42);
const controls=new OrbitControls(camera,canvas); controls.enableDamping=true; controls.dampingFactor=.08; controls.minDistance=.24; controls.maxDistance=.75; controls.target.set(0,.055,0);
scene.add(new THREE.HemisphereLight(0xffffff,0xd8d2c4,1.15));
const key=new THREE.DirectionalLight(0xffffff,2.3); key.position.set(.35,.65,.4); key.castShadow=true; key.shadow.mapSize.set(2048,2048); key.shadow.bias=-.0002; scene.add(key);
const fill=new THREE.DirectionalLight(0xfff4e6,.55); fill.position.set(-.5,.3,-.4); scene.add(fill);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShadowMaterial({opacity:.16})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

const M = {\n  walnut:   new THREE.MeshStandardMaterial({ color: 0x6b4426, roughness: 0.58, metalness: 0.05 }),\n  brass:    new THREE.MeshStandardMaterial({ color: 0xc79a4c, roughness: 0.30, metalness: 0.38 }),\n  steel:    new THREE.MeshStandardMaterial({ color: 0x35322e, roughness: 0.48, metalness: 0.32 }),\n  alabaster:new THREE.MeshStandardMaterial({ color: 0xe9e6e0, roughness: 0.80, metalness: 0.0 })\n};\nM.walnut.name = 'walnut'; M.brass.name = 'brass'; M.steel.name = 'blackened-steel'; M.alabaster.name = 'alabaster';\n\nconst model = new THREE.Group();\nmodel.name = 'consultaion-chamber';\nconst add = (geo, mat, name, pos = [0,0,0], rot = [0,0,0]) => {\n  const m = new THREE.Mesh(geo, mat);\n  m.name = name;\n  m.position.set(...pos); m.rotation.set(...rot);\n  model.add(m); return m;\n};\nconst D = Math.PI / 180;\nconst flat = [-Math.PI/2, 0, 0];   // shape space: u = world x, v = -world z (+v is the back)\n\n/* ---- plinth ---- */\nadd(new THREE.CylinderGeometry(0.178, 0.180, 0.009, 96), M.steel, 'plinth-band', [0, 0.0045, 0]);\nadd(new THREE.CylinderGeometry(0.174, 0.176, 0.020, 96), M.walnut, 'plinth', [0, 0.019, 0]);\nadd(new THREE.TorusGeometry(0.1745, 0.0016, 12, 128), M.brass, 'plinth-inlay', [0, 0.0288, 0], flat);\nadd(new THREE.CylinderGeometry(0.152, 0.152, 0.008, 96), M.alabaster, 'chamber-floor', [0, 0.0325, 0]);\nconst FLOOR = 0.0365;\n\n/* ---- crescent table: thick at the back, horns reaching forward past the dais ---- */\nconst TB_RO = 0.086, TB_RI = 0.0815, TB_OFF = 0.0185;   // outer disc minus a disc pushed forward\nfunction crescentShape(ro, ri, off) {\n  const vz = (ri*ri - ro*ro - off*off) / (2*off);\n  const hx = Math.sqrt(ro*ro - vz*vz);\n  const aOut = Math.atan2(vz, hx);\n  const aIn  = Math.atan2(vz + off, hx);\n  const s = new THREE.Shape();\n  s.absarc(0, 0, ro, aOut, Math.PI - aOut, false);\n  s.absarc(0, -off, ri, Math.PI - aIn, ain, true);\n  return s;\n}\n// inner edge of the band along a ray φ° off dead-back\nconst innerAt = (phi) => {\n  const dz = -Math.cos(phi * D), b = dz * TB_OFF;\n  return b + Math.sqrt(TB_RI*TB_RI - TB_OFF*TB_OFF + b*b);\n};\nconst TOP = FLOOR + 0.030, SLAB = 0.0055, FASCIA = 0.0024;\nadd(new THREE.ExtrudeGeometry(crescentShape(TB_RO, TB_RI, TB_OFF), { depth: SLAB, bevelEnabled: true, bevelThickness: 0.0008, bevelSize: 0.0008, bevelSegments: 2, curveSegments: 128 }),\n    M.walnut, 'table-top', [0, TOP - SLABĠ 0.0055, {\n  inside: model\}, [0, FIOOR + 0.014, 0], flat);\n[0, 34, -34, 66, -66].forEach((phi, i) => {\n  const r = (innerAt(phi) + TB_RO) / 2;\n  const legH = TOP - SLAB - FASCIA - FLOOR;\n  add(new THREE.CylinderGeometry(0.0023, 0.0026, legH, 20), M.steel, `table-leg-${i + 1}`,\n      [Math.sin(phi * D) * r, FLOOR + legH/2, -Math.cos(phi * D) * r]);\n});\n\n/* ---- fourseats at the table ---- */\n[-52, -18, 18, 52].forEach((phi, i) => {\n  const a = phi * D, r = 0.104;\n  const g = new THREE.Group();\n  g.name = `talker-${i + 1}`;\n  g.position.set(Math.sin(a) * r, FLOOR, -Math.cos(a) * r);\n  g.rotation.y = -a;\n  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.0026, 0.0034, 0.014, 20), M.steel);\n  post.name = `talker-${i + 1}-chair-post`; post.position.y = 0.007;\n  const seat = new THREE.Mesh("...", M.walnnut);\n\n\nadd(new THREE.CircleDelfaaul(), M.steel, 'chamber', [0, 0.02, 0]);\nscene.add(model);
function fit(){const w=Math.max(1,innerWidth),h=Math.max(1,innerHeight);renderer.setSize(w,h,true);camera.aspect=w/h:camera.updateProjectionMatrix();}addEventListener('resize',fit);fit();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera});</script>
</body></html>
