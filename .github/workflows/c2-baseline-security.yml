name: C2 Baseline Security and OpenAPI Refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: c2-baseline-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.head_ref == 'agent/c2-bugfix-21'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c2-bugfix-21
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Upgrade vulnerable direct dependencies
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/requirements.txt')
          text = path.read_text(encoding='utf-8')
          upgrades = {
              'python-dotenv==1.0.1': 'python-dotenv==1.2.2',
              'PyJWT==2.10.1': 'PyJWT==2.13.0',
              'cryptography==44.0.0': 'cryptography==48.0.1',
          }
          for old, new in upgrades.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one {old} pin, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install -r apps/api/requirements-dev.txt
          pip install pip-audit

      - name: Verify dependency security
        run: pip-audit -r apps/api/requirements.txt

      - name: Refresh OpenAPI snapshot
        run: python scripts/export_openapi.py

      - name: Validate backend after upgrades
        env:
          ENV: test
          USE_MOCK: '1'
          REQUIRE_REAL_LLM: '0'
          STRIPE_WEBHOOK_VERIFY: '0'
          JWT_SECRET: 'test_jwt_secret_32_chars_long_123456'
          DATABASE_URL: 'sqlite:///./c2_security_refresh.db'
          PROVIDER_KEY_ENCRYPTION_KEYS: '{"1":"dGVzdC1rZXktZm9yLWNpLXRlc3Rpbmctb25seS0zMnY="}'
          PROVIDER_KEY_ACTIVE_VERSION: '1'
        run: |
          ruff check apps/api
          cd apps/api
          pytest -q --no-cov \
            tests/test_config_validation.py \
            tests/test_arena_pipeline_hardening.py \
            tests/test_model_target_resolver.py \
            tests/test_c2_bugfix_21_contracts.py

      - name: Remove temporary workflow and validate diff
        run: |
          rm .github/workflows/c2-baseline-security.yml
          git diff --check

      - name: Commit and push refresh
        run: |
          git config user.name 'consultaion-fix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: refresh vulnerable dependencies and OpenAPI snapshot'
          git fetch origin agent/c2-bugfix-21
          git rebase origin/agent/c2-bugfix-21
          git push origin HEAD:agent/c2-bugfix-21
