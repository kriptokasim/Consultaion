name: Wave 4 additional hardening

on:
  push:
    branches:
      - fix/wave4-traffic-gate-20260905-final

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden Redis SSE ordering and async API hot paths
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          p = Path('apps/api/sse_backend.py')
          s = p.read_text()
          cls = s.index('class RedisChannelBackend:')
          start = s.index('    async def _publish_single(self, channel_id: str, event: dict) -> None:\n', cls)
          end = s.index('    async def subscribe(', start)
          block = s[start:end]
          if 'async def _publish_single_unlocked' not in block:
              header = '    async def _publish_single(self, channel_id: str, event: dict) -> None:\n'
              body = block[len(header):]
              new_block = (header
                           + '        """Publish one Redis SSE event under a distributed per-channel lock."""\n'
                           + '        lock = self._redis.lock(f"sse:publish:{channel_id}", timeout=30, blocking_timeout=30)\n'
                           + '        async with lock:\n'
                           + '            await self._publish_single_unlocked(channel_id, event)\n\n'
                           + '    async def _publish_single_unlocked(self, channel_id: str, event: dict) -> None:\n'
                           + body)
              s = s[:start] + new_block + s[end:]
          p.write_text(s)

          p = Path('apps/api/routes/arena.py')
          s = p.read_text()
          if 'from database import SessionLocal' not in s:
              s = s.replace('from auth import get_current_user\n', 'from auth import get_current_user\nfrom database import SessionLocal\n')
          if 'from utils.async_bridge import run_blocking' not in s:
              s = s.replace('from worker.arena_tasks import _execute_divergence_computation\n', 'from worker.arena_tasks import _execute_divergence_computation\nfrom utils.async_bridge import run_blocking\n')
          start = s.index('@router.get("/{debate_id}/divergence")')
          mid = s.index('@router.post("/{debate_id}/divergence")', start)
          new_get = '''@router.get("/{debate_id}/divergence")
          async def get_divergence_report(
              debate_id: str,
              current_user: User = Depends(get_current_user),
              session: Session = Depends(get_session),
          ) -> Dict[str, Any]:
              """Retrieve divergence without blocking the FastAPI event loop."""
              user_id = current_user.id
              def _read() -> Dict[str, Any]:
                  with SessionLocal() as db:
                      user = db.get(User, user_id)
                      if not user:
                          raise HTTPException(status_code=404, detail="Debate not found")
                      debate = _load_debate_for_divergence(debate_id, user, db)
                      report = _load_divergence_report(debate_id, db)
                      return _divergence_payload(report) if report else _pending_divergence_payload(debate_id, debate.status)
              return await run_blocking(_read)


          '''
          s = s[:start] + new_get + s[mid:]
          start = s.index('@router.post("/{debate_id}/user-vote")')
          new_vote = '''@router.post("/{debate_id}/user-vote")
          async def cast_arena_vote(
              debate_id: str,
              payload: UserVotePayload,
              current_user: User = Depends(get_current_user),
              session: Session = Depends(get_session),
          ) -> Dict[str, Any]:
              """Cast a vote using a thread-local DB session."""
              user_id = current_user.id
              def _write() -> Dict[str, Any]:
                  with SessionLocal() as db:
                      user = db.get(User, user_id)
                      if not user:
                          raise HTTPException(status_code=401, detail="Authentication required")
                      require_debate_access(db.get(Debate, debate_id), user, db)
                      report = db.exec(select(DivergenceReport).where(DivergenceReport.debate_id == debate_id)).first()
                      if not report:
                          raise HTTPException(status_code=400, detail="Divergence report not available")
                      all_claims = []
                      for claim_group in [report.consensus_claims, report.contested_claims]:
                          if claim_group and isinstance(claim_group, dict):
                              for claim in claim_group.get("claims", []):
                                  if isinstance(claim, dict) and claim.get("claim"):
                                      all_claims.append(claim["claim"])
                      claim_text_lower = payload.claim_text.strip().lower()
                      found = next((t for t in all_claims if t.strip().lower() == claim_text_lower), None)
                      if found is None:
                          raise HTTPException(status_code=400, detail="Invalid claim — not found in divergence report")
                      expected_id = _compute_claim_id(found)
                      if payload.claim_id != expected_id:
                          raise HTTPException(status_code=400, detail="Invalid claim_id — hash mismatch")
                      existing_vote = db.exec(select(VoteRecord).where(VoteRecord.debate_id == debate_id, VoteRecord.user_id == user_id)).first()
                      if existing_vote and (existing_vote.vote_json or {}).get("claim_text", "").strip().lower() == claim_text_lower:
                          raise HTTPException(status_code=400, detail="Already voted on this claim")
                      db.add(VoteRecord(debate_id=debate_id, user_id=user_id, vote_json={"claim_id": payload.claim_id, "claim_text": payload.claim_text, "type": "arena_vote"}))
                      db.add(UserInteraction(user_id=user_id, debate_id=debate_id, interaction_type="arena_vote", details={"claim_id": payload.claim_id, "claim_text": payload.claim_text}))
                      db.commit()
                      return {"success": True}
              return await run_blocking(_write)
          '''
          s = s[:start] + new_vote
          p.write_text(s)
          PY

          cat > apps/api/tests/test_wave4_additional_hardening.py <<'PY'
          import asyncio
          from sse_backend import CRITICAL_NON_TERMINAL_EVENT_TYPES, MemoryChannelBackend

          def test_terminal_event_is_not_evicted_from_full_critical_queue():
              backend = MemoryChannelBackend(max_queue_size=3)
              queue = asyncio.Queue(maxsize=3)
              queue.put_nowait({"type": "model_response_completed"})
              queue.put_nowait({"type": "final"})
              queue.put_nowait({"type": "model_response_failed"})
              assert backend._drop_oldest_non_terminal_critical(queue) is True
              assert "final" in {item["type"] for item in queue._queue}
              assert any(item["type"] in CRITICAL_NON_TERMINAL_EVENT_TYPES for item in queue._queue)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/sse_backend.py apps/api/routes/arena.py apps/api/tests/test_wave4_additional_hardening.py
          git diff --cached --quiet || git commit -m "fix: harden Wave 4 Redis SSE and async API paths"
          git rm .github/workflows/_wave4_more.yml
          git commit -m "chore: remove one-shot Wave 4 hardening workflow"
          git push origin HEAD:fix/wave4-traffic-gate-20260905-final
          # Triggered from a controlled branch push; no production branch mutation.
