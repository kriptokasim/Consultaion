name: C2 Web Security Refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: c2-web-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.head_ref == 'agent/c2-bugfix-21'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c2-bugfix-21
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Apply compatible security patches
        working-directory: apps/web
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('package.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['dependencies']['dompurify'] = '^3.4.12'
          data['dependencies']['postcss'] = '8.5.23'
          data.setdefault('overrides', {})['postcss'] = '$postcss'
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
          npm install
          npm audit fix

      - name: Verify audit and frontend
        working-directory: apps/web
        run: |
          npm audit --audit-level=high
          npm run test -- --run
          npm run build

      - name: Remove temporary workflow and validate diff
        run: |
          rm .github/workflows/c2-web-security-refresh.yml
          git diff --check

      - name: Commit and push security refresh
        run: |
          git config user.name 'consultaion-fix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: refresh vulnerable frontend dependencies'
          git fetch origin agent/c2-bugfix-21
          git rebase origin/agent/c2-bugfix-21
          git push origin HEAD:agent/c2-bugfix-21
