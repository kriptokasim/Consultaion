name: Focused CI repair generator

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/post-merge-ci-fix-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Fix billing limit type narrowing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/billing/service.py')
          text = path.read_text()
          old = '''    configured_limit = limits.get("max_exports_per_day")\n    try:\n        limit = int(configured_limit) if configured_limit is not None else None\n    except (TypeError, ValueError):\n        limit = None\n'''
          new = '''    configured_limit = limits.get("max_exports_per_day")\n    if isinstance(configured_limit, (str, int, float)) and not isinstance(configured_limit, bool):\n        try:\n            limit = int(configured_limit)\n        except ValueError:\n            limit = None\n    else:\n        limit = None\n'''
          if old not in text:
              raise SystemExit('target billing snippet not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply npm security fixes
        working-directory: apps/web
        run: |
          npm audit fix
          npm audit --audit-level=high

      - name: Verify focused mypy
        run: |
          pip install -r apps/api/requirements.txt
          pip install -r apps/api/requirements-dev.txt
          MYPYPATH=apps/api mypy --follow-imports=skip --ignore-missing-imports \
            apps/api/services/usage_ledger.py \
            apps/api/billing/service.py \
            apps/api/billing/providers/stripe_provider.py \
            apps/api/guards/llm_action_guard.py

      - name: Commit deterministic repairs
        run: |
          git config user.name 'consultaion-ci-fix'
          git config user.email 'info@consultaion.com'
          git add apps/api/billing/service.py apps/web/package.json apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo 'No deterministic changes to commit.'
            exit 0
          fi
          git commit -m 'fix(ci): resolve mypy and npm audit failures'
          git push origin HEAD:${{ github.head_ref }}
