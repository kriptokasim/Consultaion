name: Ruff import diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff-import-diff:
    if: github.head_ref == 'agent/prod-readiness-audit-20'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Install pinned Ruff
        run: pip install ruff==0.8.0
      - name: Print exact import autofix
        run: ruff check apps/api/tests/test_production_flags.py --diff
