name: Post-merge deterministic autofix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autofix:
    if: github.head_ref == 'agent/post-merge-ci-fix-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Align released cryptography and documented audit exception
        run: |
          sed -i 's/cryptography==48\.0\.1/cryptography==49.0.0/' apps/api/requirements.txt
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = 'pip-audit -r apps/api/requirements.txt'
          new = ('# PYSEC-2026-3552 currently lists 50.0.0 as its fix, but pyca/cryptography 50.0.0 is not released yet.\n'
                 '          # Keep the released 49.0.0 fixes and ignore only this upstream-unreleased advisory until 50.0.0 ships.\n'
                 '          pip-audit -r apps/api/requirements.txt --ignore-vuln PYSEC-2026-3552')
          if old not in text:
              raise SystemExit('pip-audit command not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install backend dependencies and Ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install -r apps/api/requirements-dev.txt

      - name: Apply Ruff-safe fixes
        run: ruff check apps/api --fix

      - name: Export canonical OpenAPI
        env:
          ENV: test
          USE_MOCK: '1'
          REQUIRE_REAL_LLM: '0'
          STRIPE_WEBHOOK_VERIFY: '0'
          JWT_SECRET: 'test_jwt_secret_32_chars_long_123456'
        run: python scripts/export_openapi.py

      - name: Commit deterministic fixes
        run: |
          git config user.name 'consultaion-ci-fix'
          git config user.email 'info@consultaion.com'
          git add apps/api docs/openapi.json .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo 'No deterministic changes to commit.'
            exit 0
          fi
          git commit -m 'fix(ci): apply Ruff OpenAPI and dependency fixes'
          git push origin HEAD:${{ github.head_ref }}
