name: C2 Test Diagnose

on:
  push:
    branches:
      - agent/c2-bugfix-21
    paths:
      - .github/workflows/c2-test-diagnose.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: c2-test-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: consultaion_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c2-bugfix-21
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
      - name: Install dependencies quietly
        working-directory: apps/api
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt -r requirements-dev.txt
      - name: Run SQLite suite with short failures
        id: sqlite
        working-directory: apps/api
        continue-on-error: true
        env:
          ENV: test
          USE_MOCK: "1"
          REQUIRE_REAL_LLM: "0"
          STRIPE_WEBHOOK_VERIFY: "0"
          JWT_SECRET: "test_jwt_secret_32_chars_long_123456"
          DATABASE_URL: "sqlite:///./ci_diagnose.db"
          PROVIDER_KEY_ENCRYPTION_KEYS: '{"1":"dGVzdC1rZXktZm9yLWNpLXRlc3Rpbmctb25seS0zMnY="}'
          PROVIDER_KEY_ACTIVE_VERSION: "1"
        run: |
          set +e
          pytest -q --no-cov --tb=short --maxfail=20 > /tmp/sqlite.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Prepare PostgreSQL schema
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql+psycopg://postgres:postgrespassword@localhost:5432/consultaion_test"
        run: alembic upgrade head
      - name: Run PostgreSQL integration suite with short failures
        id: postgres_tests
        working-directory: apps/api
        continue-on-error: true
        env:
          ENV: test
          USE_MOCK: "1"
          REQUIRE_REAL_LLM: "0"
          STRIPE_WEBHOOK_VERIFY: "0"
          JWT_SECRET: "test_jwt_secret_32_chars_long_123456"
          DATABASE_URL: "postgresql+psycopg://postgres:postgrespassword@localhost:5432/consultaion_test"
          PROVIDER_KEY_ENCRYPTION_KEYS: '{"1":"dGVzdC1rZXktZm9yLWNpLXRlc3Rpbmctb25seS0zMnY="}'
          PROVIDER_KEY_ACTIVE_VERSION: "1"
        run: |
          set +e
          pytest -q --no-cov --tb=short --maxfail=20 \
            tests/test_arena_compare_integration.py \
            tests/test_debates_api.py \
            tests/test_models.py \
            tests/test_provider_credentials.py \
            tests/test_audit_deletion.py \
            tests/test_stripe_webhook_atomicity.py \
            tests/test_sse_reliability.py > /tmp/postgres.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Post condensed diagnostics to PR
        env:
          GH_TOKEN: ${{ github.token }}
          SQLITE_EXIT: ${{ steps.sqlite.outputs.exit_code }}
          POSTGRES_EXIT: ${{ steps.postgres_tests.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          def tail(path: str, limit: int = 18000) -> str:
              with open(path, encoding="utf-8", errors="replace") as handle:
                  data = handle.read()
              return data[-limit:]

          body = (
              "## C2 backend test diagnostics\n\n"
              f"SQLite exit: `{os.environ.get('SQLITE_EXIT')}`\n"
              f"PostgreSQL exit: `{os.environ.get('POSTGRES_EXIT')}`\n\n"
              "<details><summary>SQLite failures</summary>\n\n```text\n"
              + tail('/tmp/sqlite.log')
              + "\n```\n</details>\n\n"
              "<details><summary>PostgreSQL failures</summary>\n\n```text\n"
              + tail('/tmp/postgres.log')
              + "\n```\n</details>"
          )
          request = urllib.request.Request(
              "https://api.github.com/repos/kriptokasim/Consultaion/issues/49/comments",
              data=json.dumps({"body": body}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              print(response.status)
          PY
      - name: Remove diagnostic workflow
        if: always()
        run: |
          rm -f .github/workflows/c2-test-diagnose.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/c2-test-diagnose.yml
          if ! git diff --cached --quiet; then
            git commit -m "ci: remove backend test diagnostic workflow"
            git pull --rebase origin agent/c2-bugfix-21
            git push origin HEAD:agent/c2-bugfix-21
          fi
