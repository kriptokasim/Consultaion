name: Focused backend diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/post-merge-ci-fix-01'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Show focused test files and routes
        env:
          ENV: test
          USE_MOCK: '1'
          REQUIRE_REAL_LLM: '0'
          STRIPE_WEBHOOK_VERIFY: '0'
          JWT_SECRET: 'test_jwt_secret_32_chars_long_123456'
          DATABASE_URL: 'sqlite:///./ci_diag.db'
          PROVIDER_KEY_ENCRYPTION_KEYS: '{"1":"dGVzdC1rZXktZm9yLWNpLXRlc3Rpbmctb25seS0zMnY="}'
          PROVIDER_KEY_ACTIVE_VERSION: '1'
        run: |
          find tests -maxdepth 1 -type f | sort | grep -E 'api_key|manual_entitlement|authenticated_public|byok|export_scaling' || true
          python - <<'PY'
          import os
          from main import app
          print('ENCRYPTION_KEYS_PRESENT=', bool(os.environ.get('PROVIDER_KEY_ENCRYPTION_KEYS')))
          for route in app.routes:
              path = getattr(route, 'path', '')
              if path.startswith('/keys') or 'provider-keys' in path or 'entitlement' in path:
                  print('ROUTE', sorted(getattr(route, 'methods', []) or []), path)
          PY
      - name: Run focused failures with verbose output
        env:
          ENV: test
          USE_MOCK: '1'
          REQUIRE_REAL_LLM: '0'
          STRIPE_WEBHOOK_VERIFY: '0'
          JWT_SECRET: 'test_jwt_secret_32_chars_long_123456'
          DATABASE_URL: 'sqlite:///./ci_diag.db'
          PROVIDER_KEY_ENCRYPTION_KEYS: '{"1":"dGVzdC1rZXktZm9yLWNpLXRlc3Rpbmctb25seS0zMnY="}'
          PROVIDER_KEY_ACTIVE_VERSION: '1'
        run: |
          pytest -vv --tb=short --no-cov \
            tests/test_admin_manual_entitlement.py \
            tests/test_api_keys_full.py \
            tests/test_authenticated_public_user.py \
            tests/test_byok.py \
            tests/test_export_scaling.py
