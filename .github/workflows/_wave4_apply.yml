name: Wave 4 apply and test

on:
  push:
    branches:
      - fix/wave4-traffic-gate-20260905-final

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact chamber and SSE traffic hardening
        run: |
          set -euo pipefail

          # The user-uploaded artifact is the canonical source; do not regenerate it.
          cp "Consultaion Chamber 3D-2.html" apps/web/public/embeds/consultaion-chamber.html

          # Remove the old external iframe crop. The supplied HTML owns its own framing.
          python - <<'PY'
          from pathlib import Path
          p = Path("apps/web/components/landing/HomeContent.tsx")
          s = p.read_text()
          old = 'className="absolute left-[-6%] top-[-6%] h-[112%] w-[112%] border-0"'
          new = 'className="absolute inset-0 h-full w-full border-0"'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          python - <<'PY'
          from pathlib import Path
          p = Path("apps/api/sse_backend.py")
          s = p.read_text()

          # Make Memory publication ordering cover sequence assignment through fan-out.
          # A per-backend lock prevents two publishers from allocating 57/58 and then
          # delivering 58 before 57 to the same subscriber.
          needle = '        self._coalescer_flush_tasks: dict[str, asyncio.Task[None]] = {}\n'
          repl = needle + '        self._publish_order_lock = asyncio.Lock()\n'
          if needle in s and 'self._publish_order_lock = asyncio.Lock()' not in s:
              s = s.replace(needle, repl, 1)

          start = s.index('    async def _publish_single(self, channel_id: str, event: dict) -> None:\n', s.index('class MemoryChannelBackend:'))
          end = s.index('    def _drop_from_queue(self, queue: asyncio.Queue[dict], min_priority_to_drop: int) -> bool:\n', start)
          block = s[start:end]
          if 'async def _publish_single(self, channel_id: str, event: dict) -> None:' in block and 'async with self._publish_order_lock' not in block:
              lines = block.splitlines(keepends=True)
              header = lines[0]
              body = ''.join(lines[1:])
              wrapped = header + '        async with self._publish_order_lock:\n' + ''.join('    '+ln if ln.strip() else ln for ln in body.splitlines(keepends=True))
              s = s[:start] + wrapped + s[end:]

          # Never evict a terminal event while making room for a critical event.
          # If the queue already contains only terminal events, suppressing a duplicate
          # terminal is safe because it is already durable in history and the stream exits.
          helper = '''    def _drop_oldest_non_terminal_critical(self, queue: asyncio.Queue[dict]) -> bool:\n        """Drop the oldest critical event that is not a terminal event."""\n        temp: list[dict] = []\n        dropped = False\n        while not queue.empty():\n            try:\n                item = queue.get_nowait()\n                payload = item.get("payload", {})\n                event_type = item.get("type", payload.get("type", ""))\n                if (not dropped) and event_type in CRITICAL_NON_TERMINAL_EVENT_TYPES:\n                    dropped = True\n                    from metrics import increment_metric\n                    increment_metric("sse.backpressure.critical_replaced")\n                    continue\n                temp.append(item)\n            except asyncio.QueueEmpty:\n                break\n        for item in temp:\n            try:\n                queue.put_nowait(item)\n            except asyncio.QueueFull:\n                break\n        return dropped\n\n'''
          marker = '    def _drop_from_queue(self, queue: asyncio.Queue[dict], min_priority_to_drop: int) -> bool:\n'
          if helper not in s:
              s = s.replace(marker, helper + marker, 1)

          old = 'dropped = self._drop_from_queue(sub_queue, min_priority_to_drop=0)'
          new = 'dropped = self._drop_oldest_non_terminal_critical(sub_queue)'
          if old not in s:
              raise SystemExit('expected critical eviction call not found')
          s = s.replace(old, new, 1)

          olddoc = '3. If full of critical events, the oldest critical event is replaced by the newest (latest critical wins).'
          newdoc = '3. Critical events are retained; when a critical queue is full, the oldest non-terminal critical event is replaced first. Terminal events are never evicted.'
          s = s.replace(olddoc, newdoc, 1)

          p.write_text(s)
          PY

          # Add focused regression coverage without modifying existing tests.
          cat > apps/api/tests/test_wave4_sse_terminal_preservation.py <<'PY'
          import asyncio

          from sse_backend import CRITICAL_NON_TERMINAL_EVENT_TYPES, MemoryChannelBackend


          def test_terminal_event_is_never_evicted_from_full_critical_queue():
              backend = MemoryChannelBackend(max_queue_size=3)
              queue = asyncio.Queue(maxsize=3)
              queue.put_nowait({"type": "model_response_completed"})
              queue.put_nowait({"type": "final"})
              queue.put_nowait({"type": "model_response_failed"})

              assert backend._drop_oldest_non_terminal_critical(queue) is True
              remaining = list(queue._queue)
              event_types = {item["type"] for item in remaining}

              assert "final" in event_types
              assert any(item["type"] in CRITICAL_NON_TERMINAL_EVENT_TYPES for item in remaining)

          PY

          # The temporary workflow commits its changes to the branch and then removes itself.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/embeds/consultaion-chamber.html apps/web/components/landing/HomeContent.tsx apps/api/sse_backend.py apps/api/tests/test_wave4_sse_terminal_preservation.py
          git diff --cached --quiet || git commit -m "fix: wave4 SSE terminal preservation and exact chamber"
          git rm .github/workflows/_wave4_apply.yml
          git commit -m "chore: remove one-shot Wave 4 workflow"
          git push origin HEAD:fix/wave4-traffic-gate-20260905-final
